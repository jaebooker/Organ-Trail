<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Organ Trail</title>
  <meta name="description" content="Hunt for human organs with your band of savages. A wasteland caravan game in the style of the 1985 Oregon Trail.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 7' shape-rendering='crispEdges'><rect width='7' height='7' fill='black'/><path fill='white' d='M1 0h5v1h1v4h-1v1h-5v-1h-1v-4h1z'/><path fill='black' d='M1 2h1v2h-1zM5 2h1v2h-1zM2 6h1v1h-1zM4 6h1v1h-1z'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="cabinet">
    <header>
      <span class="brand">THE ORGAN TRAIL</span>
      <button id="mute" type="button">SOUND: ON</button>
    </header>

    <div id="screen">
      <canvas id="scene" width="320" height="132" aria-label="Your caravan on the trail"></canvas>
      <div id="overlay"></div>
    </div>

    <div id="trail" class="hidden" aria-hidden="true">
      <div class="line"></div>
      <div id="marks"></div>
      <div id="marker"></div>
    </div>

    <section id="hud" class="hidden">
      <dl id="stats">
        <div><dt>Day</dt><dd id="stat-day"></dd></div>
        <div><dt>Miles traveled</dt><dd id="stat-distance"></dd></div>
        <div><dt>Crew</dt><dd id="stat-crew"></dd></div>
        <div><dt>Oxen</dt><dd id="stat-oxen"></dd></div>
        <div><dt>Human organs</dt><dd id="stat-food"></dd></div>
        <div><dt>Money</dt><dd id="stat-money"></dd></div>
        <div><dt>Firepower</dt><dd id="stat-firepower"></dd></div>
        <div><dt>Weight</dt><dd id="stat-weight"></dd></div>
      </dl>
      <div id="log" aria-live="polite"></div>
    </section>

    <section id="panel">
      <p id="prompt"></p>
      <div id="options"></div>
    </section>
  </main>

  <script src="js/art.js"></script>
  <script src="js/Game.js"></script>
</body>
</html>
